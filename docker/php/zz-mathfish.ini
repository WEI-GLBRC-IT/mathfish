; mathFISH PHP settings, layered on php.ini-production.

; No PHP version in response headers.
expose_php = Off

; Errors go to the Apache error log (docker logs), never into the page.
display_errors = Off
log_errors = On

; Session upload progress off: it runs on every POST, sessions or not, and is
; an attack path for PHP2Shell (CVE-2026-109619), CVE-2026-115560 (no PHP fix
; as of 2026-11-19) and phpAfterShell (CVE-2026-126714). mathFISH uses no sessions.
session.upload_progress.enabled = Off
