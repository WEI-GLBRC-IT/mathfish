; mathFISH PHP settings, layered on php.ini-production.

; No PHP version in response headers.
expose_php = Off

; Errors go to the Apache error log (docker logs), never into the page.
display_errors = Off
log_errors = On

; Session upload progress is one of the PHP2Shell (CVE-2026-109619) trigger
; paths. mathFISH uses no sessions.
session.upload_progress.enabled = Off
