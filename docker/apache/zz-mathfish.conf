# mathFISH Apache settings. The zz- prefix loads this after Debian's
# security.conf, so these ServerTokens/ServerSignature values win.

# No directory listings: userFiles/ holds every user's inputs and results.
# No .htaccess: the app ships none.
<Directory /var/www/html>
    Options -Indexes +FollowSymLinks
    AllowOverride None
    Require all granted
</Directory>

# No Apache or OS version in headers and error pages.
ServerTokens Prod
ServerSignature Off
